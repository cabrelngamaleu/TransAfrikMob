groups:
- name: crosspay_alerts
  rules:
  - alert: HighRequestLatency
    expr: api_request_duration_seconds_sum / api_request_duration_seconds_count > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High request latency detected"
      description: "API request latency is above 500ms for 5 minutes"

  - alert: HighErrorRate
    expr: sum(rate(http_requests_total{statusCode=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Error rate is above 5% for 5 minutes"

  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service is down"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute"