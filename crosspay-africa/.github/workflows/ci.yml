name: 🚀 CI/CD Pipeline - CrossPay Africa

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18.x'
  POSTGRES_VERSION: '14'

jobs:
  # ========================================
  # 🔍 Job 1: Linting et Vérification du Code
  # ========================================
  lint:
    name: 🔍 Linting et Qualité du Code
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Installation des dépendances
        run: npm ci
        
      - name: 🔍 Linting Backend
        run: cd services/backend && npm run lint
        
      - name: 🔍 Linting Admin
        run: cd apps/admin && npm run lint

  # ========================================
  # 🧪 Job 2: Tests Unitaires Backend
  # ========================================
  test-backend:
    name: 🧪 Tests Backend (NestJS)
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: crosspay
          POSTGRES_PASSWORD: crosspay_test
          POSTGRES_DB: crosspay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Installation des dépendances
        run: npm ci
        
      - name: 🧪 Tests unitaires Backend
        run: cd services/backend && npm run test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: crosspay
          DATABASE_PASSWORD: crosspay_test
          DATABASE_NAME: crosspay_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          
      - name: 📊 Génération de la couverture
        run: cd services/backend && npm run test:cov
        
      - name: 📤 Upload de la couverture (Backend)
        uses: codecov/codecov-action@v3
        with:
          files: ./services/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # ========================================
  # 🧪 Job 3: Tests Unitaires Admin
  # ========================================
  test-admin:
    name: 🧪 Tests Admin (Next.js)
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Installation des dépendances
        run: npm ci
        
      - name: 🧪 Tests unitaires Admin
        run: cd apps/admin && npm run test
        
      - name: 📊 Génération de la couverture
        run: cd apps/admin && npm test -- --coverage
        
      - name: 📤 Upload de la couverture (Admin)
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/admin/coverage/lcov.info
          flags: admin
          name: admin-coverage

  # ========================================
  # 🧪 Job 4: Tests Unitaires Mobile
  # ========================================
  test-mobile:
    name: 🧪 Tests Mobile (React Native)
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Installation des dépendances
        run: npm ci
        
      - name: 🧪 Tests unitaires Mobile
        run: cd apps/mobile && npm run test
        
      - name: 📊 Génération de la couverture
        run: cd apps/mobile && npm test -- --coverage
        
      - name: 📤 Upload de la couverture (Mobile)
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage

  # ========================================
  # 🏗️ Job 5: Build et Compilation
  # ========================================
  build:
    name: 🏗️ Build et Compilation
    runs-on: ubuntu-latest
    needs: [test-backend, test-admin, test-mobile]
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Installation des dépendances
        run: npm ci
        
      - name: 🏗️ Build Backend
        run: cd services/backend && npm run build
        
      - name: 🏗️ Build Admin
        run: cd apps/admin && npm run build
        
      - name: 📦 Sauvegarde des artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            services/backend/dist
            apps/admin/.next
          retention-days: 7

  # ========================================
  # 🌐 Job 6: Tests E2E (Playwright)
  # ========================================
  test-e2e:
    name: 🌐 Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Installation des dépendances
        run: npm ci
        
      - name: 🎭 Installation de Playwright
        run: npx playwright install --with-deps
        
      - name: 🌐 Tests E2E
        run: npm run test:e2e
        
      - name: 📤 Upload des résultats E2E
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ========================================
  # 🐳 Job 7: Build Docker (Optionnel)
  # ========================================
  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: 🏗️ Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./services/backend
          push: false
          tags: crosspay-africa/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # 📊 Job 8: Analyse de Couverture Globale
  # ========================================
  coverage-report:
    name: 📊 Rapport de Couverture Global
    runs-on: ubuntu-latest
    needs: [test-backend, test-admin, test-mobile]
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        
      - name: 📊 Téléchargement des rapports de couverture
        uses: actions/download-artifact@v3
        
      - name: 📈 Génération du rapport global
        run: |
          echo "## 📊 Rapport de Couverture de Code" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend: Voir rapport Codecov" >> $GITHUB_STEP_SUMMARY
          echo "✅ Admin: Voir rapport Codecov" >> $GITHUB_STEP_SUMMARY
          echo "✅ Mobile: Voir rapport Codecov" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # ✅ Job 9: Statut Final
  # ========================================
  all-tests-passed:
    name: ✅ Tous les Tests Passent
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-admin, test-mobile, build, test-e2e]
    
    steps:
      - name: 🎉 Succès du Pipeline
        run: |
          echo "✅ Tous les tests sont passés avec succès !"
          echo "✅ Backend: Tests passés"
          echo "✅ Admin: Tests passés"
          echo "✅ Mobile: Tests passés"
          echo "✅ Build: Réussi"
          echo "✅ E2E: Tests passés"
          echo ""
          echo "🚀 Le code est prêt pour la production !"
